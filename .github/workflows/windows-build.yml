name: Build and verify Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test and build standalone EXE
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify actual Windows GUI
        shell: powershell
        run: ./scripts/qa-ui.ps1 -ExePath ./artifacts/publish/B01Timer.exe
      - name: Upload Windows EXE and licenses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B01Timer-windows-x64
          path: artifacts/publish/
          if-no-files-found: error
      - name: Upload independent GUI checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B01Timer-QA
          path: artifacts/qa-ui/
          if-no-files-found: warn
